[alias]
# Inner-loop checks avoid linking and keep focused domain tests cheap to invoke.
check-fast = ["check", "--locked", "--lib"]
# Check both library and harness surfaces in one invocation so Cargo shares the library build.
check-all = ["check", "--locked", "--lib", "--example", "gameplay_harness"]
# Harness surface only (adapter-facing example) without lib tests.
check-harness = ["check", "--locked", "--example", "gameplay_harness"]

# ── tests ─────────────────────────────────────────────────────────────────────
# Soak tests carry the "soak" substring by convention; fast lanes exclude them
# with `--skip soak` so renames and module moves cannot silently un-exclude.
test-fast = ["test", "--locked", "--lib", "--quiet", "--", "--skip", "soak"]
# Focused lane: `cargo test-focused <filter>` runs matching lib tests only.
# The filter is a substring of the test path — use the owning domain or behavior:
#   cargo test-focused finance          # all finance tests
#   cargo test-focused laundering       # laundering behavior only
#   cargo test-focused world            # world domain
#   cargo test-focused "soak"           # soak only (or just `cargo soak`)
test-focused = ["test", "--locked", "--lib", "--quiet"]
# Full lib tests including soak (same as `cargo test --lib` but locked).
test-all = ["test", "--locked", "--lib", "--quiet"]
# Optimized-behavior lane: when overflow/wrapping could differ under opt.
test-release = ["test", "--locked", "--release", "--quiet"]
# Soak stress test only (mixed-state invariant exercise).
soak = ["test", "--locked", "--lib", "--quiet", "soak", "--", "--nocapture"]
# Quick single-domain aliases — sugar over `cargo test-focused <domain>`.
# Each still compiles the single lib test binary, but filters execution to one domain.
test-world = ["test", "--locked", "--lib", "--quiet", "world"]
test-finance = ["test", "--locked", "--lib", "--quiet", "finance"]
test-legal = ["test", "--locked", "--lib", "--quiet", "legal"]
test-operations = ["test", "--locked", "--lib", "--quiet", "operations"]
test-enterprises = ["test", "--locked", "--lib", "--quiet", "enterprises"]
test-economy = ["test", "--locked", "--lib", "--quiet", "economy"]
test-recruitment = ["test", "--locked", "--lib", "--quiet", "recruitment"]
test-delegation = ["test", "--locked", "--lib", "--quiet", "delegation"]

# ── gameplay harness ──────────────────────────────────────────────────────────
# Harness execution uses [profile.harness] so gameplay runs keep a separate cache.
# The harness itself owns narrative output; Cargo build logging stays quiet.
harness = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness"]
harness-rush = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "rush"]
harness-press = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "press"]
harness-recon = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "recon"]
# Full controlled comparison (narrative rotation, probes, and matched-seed batches).
harness-full = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "full"]

[term]
quiet = false
color = "auto"
