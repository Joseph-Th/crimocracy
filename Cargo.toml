[package]
name = "crimocracy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
bincode = "1.3.3"

# Tuned for solo local iteration: keep panic locations (line-tables-only) but
# maximize incremental throughput and parallel codegen. `split-debuginfo = off`
# would be slightly faster, but line tables are kept for useful failure sites.
[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256
overflow-checks = true

[profile.test]
debug = "line-tables-only"
incremental = true
codegen-units = 256
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
debug_assert_with_mut_call = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
