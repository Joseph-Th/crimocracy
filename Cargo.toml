[package]
name = "crimocracy"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.git-wizard.validation]
quick = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Check"
standard = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
full = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1"

[dependencies]
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
bincode = "1.3.3"
serde_json = "1.0"

# Routine development/test work shares its normal incremental caches. Only the explicit deep
# gameplay study below uses a separate optimized profile because unoptimized simulation is much slower.
[profile.dev]
debug = false
incremental = true
codegen-units = 32
overflow-checks = true

# Local tests do not need debugger symbols. On Windows this avoids large PDB writes and
# unnecessary link work while preserving debug assertions and overflow checks.
[profile.test]
debug = false

# Full gameplay evaluation is simulation-heavy and explicitly opt-in. Give only that deep lane
# a modest optimization profile; smoke, focused tests, and checks keep their normal warm caches.
[profile.harness]
inherits = "dev"
opt-level = 1

# Dependencies are optimized in development because they change only with dependency updates
# while several sit on hot deterministic simulation paths.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
debug_assert_with_mut_call = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
