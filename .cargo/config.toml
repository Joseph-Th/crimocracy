[alias]
# ── fast iteration (type-check only) ──────────────────────────────────────────
# Quickest syntax + type check for library systems. No test harness, no lint.
check-fast = ["check", "--locked", "--lib"]
# Compile the gameplay harness surface (adapter-facing example) without tests.
check-harness = ["check", "--locked", "--example", "gameplay_harness"]
# Ensure test targets type-check when editing test fixtures.
check-tests = ["check", "--locked", "--tests"]
# Alias for the common "check everything" pre-clippy lane.
check-all = ["check", "--locked", "--all-targets"]

# ── lint ────────────────────────────────────────────────────────────────────
lint-fast = ["clippy", "--locked", "--lib", "--", "-D", "warnings"]
lint-harness = ["clippy", "--locked", "--example", "gameplay_harness", "--", "-D", "warnings"]
# Combined library + harness clippy (used by the completion gate).
lint = ["clippy", "--locked", "--lib", "--example", "gameplay_harness", "--", "-D", "warnings"]
lint-all = ["clippy", "--locked", "--all-targets", "--", "-D", "warnings"]

# ── tests ───────────────────────────────────────────────────────────────────
# Fast library lane: excludes the invariant soak (~1s warm).
test-fast = ["test", "--locked", "--lib", "--quiet", "--", "--skip", "test_mixed_scenario_soak_preserves_invariants"]
# All lib tests including soak (use sparingly). Note: lib-only, not --all-targets (gate uses lib+tests).
test-all = ["test", "--locked", "--lib"]
# Focused filter lane: `cargo test-focused <filter>` runs matching lib tests. Filter is positional after alias.
test-focused = ["test", "--locked", "--lib", "--quiet"]
# Single-threaded focused run for deterministic ordering checks.
test-focused-single = ["test", "--locked", "--lib", "--quiet", "--", "--test-threads=1"]
# Documentation contract and invariant lane.
test-doc = ["test", "--locked", "--test", "documentation_contracts"]
# Integration tests (tests/ + doc contracts) without examples.
test-integration = ["test", "--locked", "--tests", "--quiet"]
# Optimized-behavior lane: run when optimized compilation could change behavior
# (overflow arithmetic, wrapping, or float paths that dev and release share).
test-release = ["test", "--locked", "--release", "--quiet"]
soak = ["test", "--locked", "--lib", "core::state::tests::test_mixed_scenario_soak_preserves_invariants", "--", "--exact", "--nocapture"]

# ── gameplay harness ────────────────────────────────────────────────────────
# Smoke contract as an ignored test (used by `verify` gate, fail-closed).
harness-smoke = ["test", "--locked", "--quiet", "--example", "gameplay_harness", "tests::smoke_mode_covers_canonical_paths", "--", "--ignored", "--exact", "--nocapture"]
# Direct harness executions (human-readable narrative output). Use --quiet to keep output concise.
harness = ["run", "--locked", "--quiet", "--example", "gameplay_harness"]
harness-rush = ["run", "--locked", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "rush"]
harness-press = ["run", "--locked", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "press"]
harness-recon = ["run", "--locked", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "recon"]
# Full controlled comparison (bounded, deterministic, artifact-persisting).
harness-full = ["run", "--locked", "--quiet", "--example", "gameplay_harness", "--", "--mode", "full"]

# ── formatting ──────────────────────────────────────────────────────────────
fmt-check = ["fmt", "--check"]
# Gate shortcut: fmt + fast lib tests.
verify-fast = ["test", "--locked", "--lib", "--quiet", "--", "--skip", "test_mixed_scenario_soak_preserves_invariants"]

[build]
# Incremental compilation is disabled in [profile.dev] (measured slower than a
# plain rebuild on this crate). `verify.ps1` also pins CARGO_INCREMENTAL=0 so
# an inherited environment variable cannot silently re-enable it.
# `verify.ps1 -Jobs N` caps parallelism when needed on a quieter machine.

[term]
# Avoid redundant verbose cargo output for fast lanes; `verify.ps1` adds
# explicit timing and stage summaries instead.
quiet = false
color = "auto"
