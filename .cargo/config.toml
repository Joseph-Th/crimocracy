[alias]
# ── fast iteration (type-check only) ──────────────────────────────────────────
# Quickest syntax + type check for library systems. No test harness, no lint.
check-fast = ["check", "--locked", "--lib"]
# Compile the gameplay harness surface (adapter-facing example) without tests.
check-harness = ["check", "--locked", "--example", "gameplay_harness"]

# ── tests ───────────────────────────────────────────────────────────────────
# Soak-class tests are named with the substring "soak" by convention; fast
# lanes exclude them with `--skip soak` so renames and module moves cannot
# silently un-exclude them.
# Fast library lane: excludes the invariant soak (~1s warm).
test-fast = ["test", "--locked", "--lib", "--quiet", "--", "--skip", "soak"]
# Focused filter lane: `cargo test-focused <filter>` runs matching lib tests. Filter is positional after alias.
test-focused = ["test", "--locked", "--lib", "--quiet"]
# Optimized-behavior lane: run when optimized compilation could change behavior
# (overflow arithmetic, wrapping, or float paths that dev and release share).
test-release = ["test", "--locked", "--release", "--quiet"]
soak = ["test", "--locked", "--lib", "--quiet", "soak", "--", "--nocapture"]

# ── gameplay harness ────────────────────────────────────────────────────────
# All harness execution uses [profile.harness] (dev semantics, opt-level 1):
# warm runs are ~10x faster than the dev profile and library iteration caches
# in target/debug are never disturbed. Use --quiet to keep output concise.
harness = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness"]
harness-rush = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "rush"]
harness-press = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "press"]
harness-recon = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "recon"]
# Full controlled comparison (bounded, deterministic, artifact-persisting).
harness-full = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "full"]

[build]
# Incremental compilation is disabled in [profile.dev] (measured slower than a
# plain rebuild on this crate) and enabled for the single-binary harness
# profile (measured much faster there). `verify.ps1` pins CARGO_INCREMENTAL=0
# around dev-profile stages so an inherited variable cannot re-enable dev
# incremental, and clears it around harness-profile stages so this profile's
# own setting governs.
# `verify.ps1 -Jobs N` caps parallelism when needed on a quieter machine.

[term]
# Avoid redundant verbose cargo output for fast lanes; `verify.ps1` adds
# explicit timing and stage summaries instead.
quiet = false
color = "auto"
