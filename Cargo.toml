[package]
name = "crimocracy"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.git-wizard.validation]
quick = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
standard = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
full = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1"

[dependencies]
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
bincode = "1.3.3"

# Tuned for solo local iteration: keep panic locations (line-tables-only) but
# balance incremental throughput and link time for a single-crate workspace.
# codegen-units=32 gives ~4x fewer object files than 256, cutting link/PDB time
# dramatically while still keeping incremental rebuilds under a second warm.
# split-debuginfo=off avoids per-CU PDB writes on Windows.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"
incremental = true
codegen-units = 32
overflow-checks = true

[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"
incremental = true
codegen-units = 32
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
debug_assert_with_mut_call = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
