[package]
name = "crimocracy"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.git-wizard.validation]
quick = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
standard = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
full = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1"

[dependencies]
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
bincode = "1.3.3"

# Tuned by measurement for solo local iteration on this single large crate.
# Cost of one small library edit with warm dependencies, on this machine:
#   re-check            ~7-16s (load dependent)
#   rebuild+link tests  ~23-31s
# Measured alternatives that LOST:
#   incremental = true          check 44s, test rebuild up to 187s (cache
#                               encode/decode costs exceed reuse here)
#   debug = "line-tables-only"  ~+30s per rebuild; panic messages keep file/line
#                               via the Location API without debuginfo, only
#                               RUST_BACKTRACE source lines degrade
#   codegen-units = 16          ~+19s per rebuild
#   codegen-units = 256         ~+50s per rebuild
#   linker = "rust-lld"         ~+40s per test-binary link
[profile.dev]
debug = false
incremental = false
codegen-units = 32
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
debug_assert_with_mut_call = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
