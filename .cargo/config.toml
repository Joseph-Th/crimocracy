[alias]
# Inner-loop checks avoid linking and keep focused domain tests cheap to invoke.
check-fast = ["check", "--locked", "--lib"]
# Check both library and harness surfaces in one invocation so Cargo shares the library build.
check-all = ["check", "--locked", "--lib", "--example", "gameplay_harness"]
# Harness surface only (adapter-facing example) without lib tests.
check-harness = ["check", "--locked", "--example", "gameplay_harness"]

# ── tests ─────────────────────────────────────────────────────────────────────
# Soak tests carry the "soak" substring by convention; fast lanes exclude them
# with `--skip soak` so renames and module moves cannot silently un-exclude.
test-fast = ["test", "--locked", "--lib", "--quiet", "--", "--skip", "soak"]
# Focused lane: `cargo test-focused <filter>` runs matching lib tests only.
# The filter is a substring of the test path — use the owning domain or behavior:
#   cargo test-focused finance          # all finance tests
#   cargo test-focused laundering       # laundering behavior only
#   cargo test-focused world            # world domain
#   cargo test-focused "soak"           # soak only (or just `cargo soak`)
# NOTE: this alias does not exclude soak-class tests, so a broad filter such as
# `state` also matches the soak stress test. The scripted lanes
# (`verify -Fast -Filter`, `watch -Filter`) append `-- --skip soak` unless the
# filter itself contains `soak`; add it manually here when needed:
#   cargo test-focused state -- --skip soak
test-focused = ["test", "--locked", "--lib", "--quiet"]
# Full lib tests including soak (same as `cargo test --lib` but locked).
# Soak is a ~4s mixed-state stress test: run this only when the changed contract
# needs it, never as part of a gate (`test-fast` is the gate lane).
test-all = ["test", "--locked", "--lib", "--quiet"]
# Optimized-behavior lane: when overflow/wrapping could differ under opt.
test-release = ["test", "--locked", "--release", "--quiet"]
# Soak stress test only (mixed-state invariant exercise).
soak = ["test", "--locked", "--lib", "--quiet", "soak", "--", "--nocapture"]
# Harness implementation contracts. Scenario-scale checks are explicitly ignored from the
# routine target; the deep lane runs every ignored harness test.
# Focused harness iteration appends a filter substring, mirroring test-focused:
#   cargo test-harness press_stand_down   # one harness behavior only
# Focused strategy smoke stays on the warm dev cache for sub-second iteration:
#   cargo harness-rush  (or -press / -recon)  # one strategy branch only
test-harness = ["test", "--locked", "--quiet", "--example", "gameplay_harness"]
test-harness-deep = ["test", "--locked", "--quiet", "--example", "gameplay_harness", "--", "--ignored"]

# ── gameplay harness ──────────────────────────────────────────────────────────
# Smoke/focused harness execution stays on the ordinary dev profile so normal iteration reuses
# one gameplay-build cache. The harness owns its own output; Cargo build logging stays quiet.
# Windows: if rebuilds feel pathological, exclude the repository target directory
# from Defender real-time scanning.
harness = ["run", "--locked", "--quiet", "--example", "gameplay_harness"]
harness-rush = ["run", "--locked", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "rush"]
harness-press = ["run", "--locked", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "press"]
harness-recon = ["run", "--locked", "--quiet", "--example", "gameplay_harness", "--", "--mode", "smoke", "--strategy", "recon"]
# Full comparison is a deep, simulation-heavy lane. Use the modestly optimized harness profile
# so repeated studies spend time simulating rather than interpreting unoptimized minute ticks.
harness-full = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "full"]
harness-full-detail = ["run", "--locked", "--profile", "harness", "--quiet", "--example", "gameplay_harness", "--", "--mode", "full", "--detail"]

[term]
quiet = false
color = "auto"
