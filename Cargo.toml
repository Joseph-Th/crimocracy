[package]
name = "crimocracy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
bincode = "1.3.3"

# Keep panic locations in local test/check artifacts without paying for full debug information.
# This materially reduces compile and link time for the large deterministic test binary while
# preserving useful failure locations for the solo local workflow.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
debug_assert_with_mut_call = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
