[package]
name = "crimocracy"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.git-wizard.validation]
quick = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
standard = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
full = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1"

[dependencies]
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
bincode = "1.3.3"

# ── Profile tuning for solo local iteration ─────────────────────────────────
# This is a single large crate; profile choices are measured on this machine.
#
# Inner loop (while editing one domain):
#   cargo check-fast                  0.06s warm -- type-check only, no link
#   cargo test-focused finance        0.11s warm -- filtered lib tests
# Outer loop (behavior ready):
#   .\scripts\verify.cmd -Fast        0.7s  warm -- iteration gate
#   .\scripts\verify.cmd              2-3s  warm -- full gate (before push)
#
# Warm cache, no file changed:        check 0.06s  |  test 0.11s  |  fmt 0.64s
# After touching one lib file:        check 6s     |  test 12s   |  harness full n=1: 5s
# Cold build (clean):                 ~60-90s
#
# The split profile design is the key win: library iteration and harness
# execution never invalidate each other's caches.
#
# Windows: exclude `target\` from Defender real-time scanning (can save 30-60s
# on cold builds). See .cargo/config.toml [build] note.
#
# Measured alternatives that LOST (kept as warnings for future tuners):
#   incremental = true (dev)          check 44s, test rebuild up to 187s
#                                     (cache encode/decode > reuse for the
#                                      large lib test binary; harness profile
#                                      re-measures and wins for its single binary)
#   debug = "line-tables-only"        ~+30s per rebuild; panic file/line
#                                     already via Location API without debuginfo
#   codegen-units = 16                ~+19s per rebuild
#   codegen-units = 256               ~+50s per rebuild
#   linker = "rust-lld"               ~+40s per test-binary link
#   opt-level = 1 in [profile.dev]    test rebuild 12s -> 24s; doubles the
#                                     dominant iteration cost (harness profile
#                                     below reuses this setting where it wins)
#   opt-level = 2 in [profile.harness] no runtime gain over 1, higher rebuild
#
# Harness full mode (--samples 1): ~17s at opt-level 0 vs ~1.7s at opt-level 1
# (identical behavior: overflow checks on, integer semantics unchanged).
[profile.dev]
debug = false
incremental = false
codegen-units = 32
overflow-checks = true

# Harness execution profile — dev semantics at opt-level 1. Owns the `harness*`
# cargo aliases and the full-gate's n=1 stage. Artifacts live in target/harness/
# so switching between editing and harness running never invalidates the other's
# cache. Incremental wins here (mirror of [profile.dev]): one small binary,
# so cache encode is cheap and post-edit reuse is large (75s -> 9-16s measured).
# Costs ~0.5 GB under target/harness/incremental. An inherited
# CARGO_INCREMENTAL=0 overrides the profile both ways, so verify.ps1 / watch.ps1
# scope the pin per stage: dev stages force 0, harness stages clear it.
[profile.harness]
inherits = "dev"
opt-level = 1
incremental = true

# Dependencies compile at opt-level 3 in every dev-derived profile. They rebuild
# only on lockfile changes, so the edit loop pays nothing while ChaCha8 / serde
# hot paths stay optimized. Measured harness-full --samples 8: 3.9s -> 3.5s.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
debug_assert_with_mut_call = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
