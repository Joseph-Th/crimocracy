[package]
name = "crimocracy"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.git-wizard.validation]
quick = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
standard = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Fast"
full = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1"

[dependencies]
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
bincode = "1.3.3"
serde_json = "1.0"

# Development and harness profiles keep their caches separate. The default development
# profile favors edit-time checking and tests; the harness profile optimizes the single
# gameplay executable while retaining overflow checks and development semantics.
[profile.dev]
debug = false
incremental = false
codegen-units = 32
overflow-checks = true

# Harness artifacts use their own profile/cache so gameplay runs do not invalidate the
# development library/test cache. Verification scripts scope CARGO_INCREMENTAL per lane.
[profile.harness]
inherits = "dev"
opt-level = 1
incremental = true

# Dependencies are optimized in development-derived profiles because they change only with
# dependency updates while several sit on hot deterministic simulation paths.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
debug_assert_with_mut_call = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
