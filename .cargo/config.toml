[alias]
# Fast, source-focused feedback while editing production systems.
check-fast = ["check", "--locked", "--lib", "--example", "gameplay_harness"]
lint-fast = [
    "clippy",
    "--locked",
    "--lib",
    "--example",
    "gameplay_harness",
    "--",
    "-D",
    "warnings",
]
test-fast = [
    "test",
    "--locked",
    "--lib",
    "--quiet",
    "--",
    "--skip",
    "test_mixed_scenario_soak_preserves_invariants",
]
soak = [
    "test",
    "--locked",
    "--lib",
    "core::state::tests::test_mixed_scenario_soak_preserves_invariants",
    "--",
    "--exact",
    "--nocapture",
]
harness-smoke = [
    "test",
    "--locked",
    "--example",
    "gameplay_harness",
    "tests::smoke_mode_covers_canonical_paths",
    "--",
    "--ignored",
    "--exact",
    "--nocapture",
]
harness-rush = [
    "run",
    "--locked",
    "--example",
    "gameplay_harness",
    "--",
    "--mode",
    "smoke",
    "--strategy",
    "rush",
]
harness-press = [
    "run",
    "--locked",
    "--example",
    "gameplay_harness",
    "--",
    "--mode",
    "smoke",
    "--strategy",
    "press",
]
harness-recon = [
    "run",
    "--locked",
    "--example",
    "gameplay_harness",
    "--",
    "--mode",
    "smoke",
    "--strategy",
    "recon",
]
harness = ["run", "--locked", "--example", "gameplay_harness"]
